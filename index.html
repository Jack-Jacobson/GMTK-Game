<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <!-- <link rel='stylesheet' href='main.css'> -->
    <style>
        #gameCanvas {
            border: 1px solid black;
        }
        body {
            background: #fff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        #MinigameOverlay {
            position: fixed;
            background: rgba(0,0,0,0.5);
            display: none; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            width: 100%; 
            z-index: 1000;
        }
        #StartScreen {
            position: fixed;
            background: rgba(0,0,0,0.5);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            width: 100%; 
            z-index: 5000;
        }
        #ui-container {
            width: auto;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text-dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        #timer {
            font-size: 1.5rem;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
    </style>
</head>

<body>
    <div id="StartScreen">
        <div>
            <h1>Game Name</h1>
            <button id="StartGameButton">Start Game</button>
        </div>
    </div>

    <div id="MinigameOverlay">
        <iframe id="frame" width="100%" height="100%"></iframe>
    </div>
    
    <div id="ui-container">
        <div class="header">
            <div id="timer">PLACEHOLDER_TIMER</div>
        </div>
        <canvas id="gameCanvas" width="1000" height="1000" ></canvas>
        <script src="GameHandler.js"></script>
    </div>
</body>
</html>
