<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <!-- <link rel='stylesheet' href='main.css'> -->
    <style>
        #gameCanvas {
            border: 1px solid black;
        }
        :root {
            /* VARIABLE FEEL FREE TO ADJUST */
            --bg: #0a0a0a;
            --text: #ff3333;
            --text-dim: #771111;
            --tv: #ffffff;
            --wall: #333333;
            --world-bg: #111111;
            --player: #aa0000;
            --goal: #00ffcc;
        }
        body {
            /* GLOBAL SETTINGS FOR PAGE */
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.35) 0px,
                rgba(0, 0, 0, 0.35) 2px,
                transparent 2px,
                transparent 4px
            );
            z-index: 999;
            pointer-events: none;
        }
        #MinigameOverlay {
            position: fixed;
            background: rgba(0,0,0,0.5);
            display: none; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            width: 100%; 
            z-index: 1000;
        }
        #StartScreen {
            position: fixed;
            background: rgba(0,0,0,0.5);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            width: 100%; 
            z-index: 10;
        }
        #LoseScreen {
            position: fixed;
            background: rgba(0,0,0,0.5);
            display: none; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            width: 100%; 
            z-index: 10;
        }
        #ui-container {
            width: auto;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text-dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .title {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--text-dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 5.0rem;
            letter-spacing: 2px;
        }
        #timer {
            font-size: 1.5rem;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        canvas {
            transform-origin: center;
            background-color: var(--world-bg);
        }
        .btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--text);
            border: 2px solid var(--text-dim);
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--text-dim);
            color: var(--bg);
        }
    </style>
</head>

<body>
    <div id="StartScreen">
        <div class="title">
            <h1>Every Second Counts</h1>
            <button id="StartGameButton" class="btn">Start Game</button>
        </div>
    </div>
    <div id="LoseScreen">
        <div class="title">
            <h1>You lost</h1>
            <div>Reload the page to try again!</div>
        </div>
    </div>

    <div id="MinigameOverlay">
        <iframe id="frame" width="100%" height="100%"></iframe>
    </div>
    
    <div id="ui-container">
        <div class="header">
            <div id="timer">PLACEHOLDER_TIMER</div>
        </div>
        <canvas id="gameCanvas" width="650" height="500" ></canvas>
        <script src="GameHandler.js?v=5"></script>
    </div>
</body>
</html>
