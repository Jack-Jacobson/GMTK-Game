<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Puzzle</title>
    <link rel="stylesheet" href="memorypuzzle.css?v=2139713">
</head>
<body>
    <div id="ui-container">
        <div class="header">
            <h1>COUNTDOWN</h1>
            <div id="GlobalTimer">PLACEHOLDER_TIMER</div>
        </div>
        <div class="header">
            <h1>MEMORY SEQUENCE</h1>
            <div id="timer">WAITING...</div>
        </div>

        <!-- START SCREEN -->
        <div id="startScreen">
            <p class="subtext">
                MEMORIZE THE COLOR SEQUENCE AND<br>REPEAT IT IN THE CORRECT ORDER TO DEFUSE.
                <BR> PRESS ESC TO EXIT
            </p>
            <button id="start" class="btn">START SEQUENCE</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" style="display: none;">
            
            <div class="info-row">
                <h2 id="round">ROUND 1/4</h2>
                <p id="message">PREPARING...</p>
            </div>

            <div class="sequence-container">
                <div class="subtext">TARGET SEQUENCE</div>
                <div id="sequence"></div>
            </div>

            <div class="sequence-container">
                <div class="subtext">INPUT SEQUENCE</div>
                <div id="answer"></div>
            </div>

            <!-- Colour buttons -->
            <div id="buttons">
                <button class="colour red" data-color="RED"></button>
                <button class="colour blue" data-color="BLUE"></button>
                <button class="colour green" data-color="GREEN"></button>
                <button class="colour yellow" data-color="YELLOW"></button>
                <button class="colour cyan" data-color="CYAN"></button> <!-- Swapped Black for Cyan -->
                <button class="colour white" data-color="WHITE"></button>
                <button class="colour purple" data-color="PURPLE"></button>
                <button class="colour orange" data-color="ORANGE"></button>
            </div>

            <div id="controls">
                <button id="erase" class="btn">ERASE</button>
                <button id="restart" class="btn">RESTART ROUND</button>
                <button id="enter" class="btn">SUBMIT</button>
            </div>
            
        </div>
        
    </div>

    <script src="memorypuzzle.js?v=12391"></script>
</body>
</html>
