<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Combination</title>
    <link rel="stylesheet" href="lockcombination.css?v=123213213">
</head>
<body>
    <div id="ui-container">
        
        <div class="header">
            <h1>CRACK THE LOCK</h1>
            <div id="timer">60:00</div>
        </div>

        <div class="info-row">
            <div id="round">ROUND 1/3 - EASY</div>
            <div id="message">SOLVE THE CLUES TO UNLOCK</div>
        </div>

        <!-- Sticky Note -->
        <div id="sticky-container">
            <div id="clues">
                <!-- Clues injected here -->
            </div>
        </div>
        
        <div id="code-display-container">
            <h2 id="code">_ _ _ _</h2> 
        </div>

        <div id="keypad">
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>

            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>

            <button class="number" id="btn-0">0</button>
        </div>

        <div id="controls">
            <button id="clear" class="control-btn">CLEAR</button>
            <button id="enter" class="control-btn">ENTER</button>
            <button id="restart" class="control-btn">REBOOT</button>
        </div>

    </div>

    <script src="lockcombination.jsv=23123"></script>
</body>
</html>
